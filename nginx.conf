server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hashed build assets (JS/CSS/fonts) are safe to cache indefinitely —
    # a new deploy ships new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy's asset
    # references are picked up right away instead of being served stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: no server-side routes, everything resolves to
    # index.html (the app itself only ever reads query params off "/").
    location / {
        try_files $uri /index.html;
    }
}
